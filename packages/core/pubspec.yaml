name: core
description: Core package containing shared models, authentication, and utilities for the CareQA platform
version: 1.0.0
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  equatable: ^2.0.5
  json_annotation: ^4.8.0
  flutter_secure_storage: ^9.0.0
  jwt_decoder: ^2.0.1
  shared_preferences: ^2.2.0
  intl: ^0.19.0
  uuid: ^4.0.0
  supabase_flutter: ^2.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.0
  json_serializable: ^6.6.0

flutter:
  uses-material-design: true