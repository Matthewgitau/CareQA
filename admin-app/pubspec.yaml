name: admin_app
description: CareQA Admin Application
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Supabase dependencies
  supabase_flutter: ^2.2.0

  # UI and utilities
  cupertino_icons: ^1.0.2
  provider: ^6.1.1
  intl: ^0.19.0
  flutter_dotenv: ^5.1.0
  local_auth: ^2.1.8
  shared_preferences: ^2.2.2
  
  # Form validation and utilities
  get_it: ^7.6.7
  logger: ^2.0.2
  file_picker: ^8.0.0
  uuid: ^4.0.0

  # Stripe Checkout (open payment page in browser + return to app)
  url_launcher: ^6.1.0

  # Image and OCR
  image_picker: ^1.0.0
  google_mlkit_text_recognition: ^0.12.0

  # File management
  path_provider: ^2.1.0

  # PDF and printing
  pdf: ^3.10.0
  printing: ^5.11.0
  share_plus: ^7.2.0

  # Charts
  fl_chart: ^0.68.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/